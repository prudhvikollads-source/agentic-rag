[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "A corrective / self-RAG question-answering system over a bundled corpus. Fully offline: pure-Python BM25 retrieval and a deterministic extractive mock model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prudhvi Kolla" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
